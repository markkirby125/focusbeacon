name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build minified bundle
        run: npm run build

      - name: Verify minified bundle
        run: node --check focusbeacon.min.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusbeacon-dist
          path: focusbeacon.min.js
