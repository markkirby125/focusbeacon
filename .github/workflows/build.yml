name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./focusbeacon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: node --check focusbeacon.js

      - name: Build minified bundle
        run: node build.js

      - name: Verify minified bundle
        run: node --check focusbeacon.min.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusbeacon-dist
          path: focusbeacon/focusbeacon.min.js
